version: '3.8'

services:
  # ----------------------------------------
  # Infra: Banco de Dados (MongoDB)
  # ----------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: gdash_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gdash-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # ----------------------------------------
  # Infra: Fila (RabbitMQ)
  # ----------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: gdash_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"   # Porta de serviço
      - "15672:15672"             # Painel de gestão
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gdash-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  # ----------------------------------------
  # App: Coletor de Clima (Python)
  # ----------------------------------------
  weather-collector:
    build: ./weather-collector
    container_name: gdash_collector
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    networks:
      - gdash-network

  # ----------------------------------------
  # App: Processador de Fila (Go Worker)
  # ----------------------------------------
  queue-worker:
    build: ./queue-worker
    container_name: gdash_worker
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      API_URL: http://core-api:3000/api/weather/logs
    networks:
      - gdash-network

  # ----------------------------------------
  # App: API Principal (NestJS)
  # ----------------------------------------
  core-api:
    build: ./core-api
    container_name: gdash_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gdash-network

  # ----------------------------------------
  # App: Frontend (React + Vite)
  # ----------------------------------------
  web-dashboard:
    build: ./web-dashboard
    container_name: gdash_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - core-api
    networks:
      - gdash-network

volumes:
  mongo_data:
  rabbitmq_data:

networks:
  gdash-network:
    driver: bridge